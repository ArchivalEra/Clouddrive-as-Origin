[package]
name = "origin-front"
version = "0.1.0"
edition = "2021"
description = "Pingora TLS/H2 reverse proxy front for Clouddrive-as-Origin — pure byte movement, no cache semantics"
license = "MIT"

[dependencies]
anyhow = "1"
bytes = "1"
async-trait = "0.1"
http = "1"
ipnet = "2"
pingora = { version = "0.8", features = ["any_tls", "proxy", "rustls", "connection_filter"] }
pingora-error = "0.8"
pingora-limits = "0.8"
prometheus = "0.13"
tracing = "0.1"
