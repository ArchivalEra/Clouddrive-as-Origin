# Clouddrive-as-Origin — oracle node, main plane (node B: overseas drive)
#
# This file sets NO `cache_profile`: the default is `efficient` (ADR-0022), and
# the unit that runs it is `origin-cache-efficient.service`. The unit and this
# file were named after the retired `standard` profile until 2026-09-21; the
# `cache_dir` below was NOT renamed with them, because it holds the live
# metadata database and every staged sidecar — a rename would orphan both and
# start the node on an empty cache.

# Dual-stack front: EdgeOne origin-pull arrives over IPv6 (apple.dib.l.cd
# is IPv6-only), so bind [::] not 0.0.0.0.
front_listen = "[::]:7777"
front_metrics_listen = "127.0.0.1:9090"
# Client CIDRs refused at connection time (before TLS handshake).
front_ip_block = []
# Client CIDRs exempt from per-IP rate limiting (ops path is never throttled).
front_ip_allow = []
# Per-client-IP requests/sec ceiling; Omit = disabled (threshold lands later).
front_rate_rps = 0
# Admission control (R4, 2026-09-23). EdgeOne sets this header on every request
# it forwards to us -- `ModifyRequestHeader` on rule-3usngannhvqa, its value
# living in the rule and never here -- so a request without it did not come from
# the CDN. The port has to stay reachable, because the free plan does not
# publish the origin-pull ranges (docs/security-hardening.md R3), so this check
# is what keeps strangers out. The env var is set in
# /opt/origin-cache/origin-cache.env; naming it here without setting it is a
# boot failure on purpose.
front_origin_token_header = "X-Origin-Token"
front_origin_token_env = "ORIGIN_TOKEN"
# Loopback, spelled out rather than left implicit: accept.sh, the LAB and the
# watchdog reach the front over loopback and carry no edge stamp.
front_origin_token_exempt = ["127.0.0.1/32", "::1/128"]
tls_cert_env = "ORIGIN_TLS_CERT_PATH"
tls_key_env = "ORIGIN_TLS_KEY_PATH"
listen_addr = "127.0.0.1:8080"
# Historical path name: see the header. Renaming it loses the cache.
cache_dir = "/opt/origin-cache/cache-standard"
max_size_bytes = 10737418240
inactive_ttl_secs = 1200
revalidate_ttl_secs = 60
negative_ttl_secs = 60
concurrency_per_upstream = 3
prewarm_shared_secret_env = "ORIGIN_PREWARM_SECRET"

[[upstreams]]
# Upstream id MUST equal the first URL path segment (bucket-alias
# semantics): requests arrive as /googledrive1/<key>, so id = the mount
# name. A mismatched id falls through to the default route and the
# root_path gets double-prefixed (googledrive1/googledrive1/...).
id = "googledrive1"
type = "openlist"
base_url = "http://127.0.0.1:5244/dav"
root_path = "googledrive1"
username_env = "OPENLIST_USERNAME"
password_env = "OPENLIST_PASSWORD"

[[routes]]
prefix = ""
upstream = "googledrive1"
