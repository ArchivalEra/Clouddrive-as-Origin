# Clouddrive-as-Origin — oracle node, nocache profile (node A: small box)
# Internal/experimental port; dual-stack front.
front_listen = "[::]:7778"
listen_addr = "127.0.0.1:8081"
cache_dir = "/opt/origin-cache/cache-nocache"
max_size_bytes = 10737418240
inactive_ttl_secs = 1200
revalidate_ttl_secs = 60
negative_ttl_secs = 60
concurrency_per_upstream = 3
prewarm_shared_secret_env = "ORIGIN_PREWARM_SECRET"

[[upstreams]]
# Upstream id MUST equal the first URL path segment (bucket-alias
# semantics) — see config-standard.toml for the double-prefix trap.
id = "googledrive1"
type = "openlist"
base_url = "http://127.0.0.1:5244/dav"
root_path = "googledrive1"
username_env = "OPENLIST_USERNAME"
password_env = "OPENLIST_PASSWORD"
cache_profile = "nocache"

[[routes]]
prefix = ""
upstream = "googledrive1"
