# journald retention for the node. The services log to the journal; the
# default retention is unbounded, and this node had no cap of its own until
# this file was installed.
#
# Install: sudo mkdir -p /etc/systemd/journald.conf.d
#          sudo cp deploy/oracle/journald-origin-cache.conf \
#                  /etc/systemd/journald.conf.d/origin-cache.conf
#          sudo systemctl restart systemd-journald
[Journal]
SystemMaxUse=500M
