# CDN-LAB config F: the FRONT's own guards (LAB section 16).
#
# The front plane's pure helpers have unit tests (CIDR parsing, the rate gate's
# `exceeds`, the metric families); what had none was the WIRING — whether the
# filter, the gate and the body caps are actually consulted on a live
# connection. This instance exists so those are asserted against a running
# front rather than inferred from the helpers.
#
# The rate ceiling is deliberately tiny (2/s): the section sends three requests
# and requires the third to be refused. The block list is NOT exercised here —
# blocking a loopback address would need the front bound to 0.0.0.0 to be
# reachable from a second loopback address, and opening that port on a test box
# is not worth one assertion; the matcher itself is unit-tested.
front_listen = "127.0.0.1:7782"
front_metrics_listen = "127.0.0.1:9095"
front_rate_rps = 2
# R4's gate, with the DEFAULT exemption list: loopback (this section's own
# requests) carries no stamp and is still served. That is the exemption arm --
# the four assertions above passing unstamped is the evidence for it.
front_origin_token_header = "X-Origin-Token"
front_origin_token_env = "CDN_LAB_ORIGIN_TOKEN"
listen_addr = "127.0.0.1:8086"
cache_dir = "/mnt/hdd/CDN-LAB/cache-f"
max_size_bytes = 268435456
inactive_ttl_secs = 1200
revalidate_ttl_secs = 60
negative_ttl_secs = 60
concurrency_per_upstream = 3
prewarm_shared_secret_env = "CDN_LAB_PREWARM_SECRET"
session_window_bytes = 262144
[cache_profiles.efficient]
min_file_size = 4

[[upstreams]]
id = "media"
type = "openlist"
base_url = "http://127.0.0.1:5244/dav"
root_path = "media"
username_env = "CDN_LAB_DAV_USER"
password_env = "CDN_LAB_DAV_PASS"
cache_profile = "efficient"

[[routes]]
prefix = ""
upstream = "media"
