# CDN-LAB config C: efficient profile with a SHORT coverage window (5s) so
# the ledger-decay acceptance test can observe expiry in real time (map #30
# T2). Staged spans serve reads directly (ADR-0015), so the decade is
# observable as coverage_intervals dropping to zero while the .seg files stay.
front_listen = "127.0.0.1:7779"
front_metrics_listen = "127.0.0.1:9092"
listen_addr = "127.0.0.1:8082"
cache_dir = "/mnt/hdd/CDN-LAB/cache-c"
max_size_bytes = 10737418240
inactive_ttl_secs = 1200
revalidate_ttl_secs = 60
negative_ttl_secs = 60
concurrency_per_upstream = 3
prewarm_shared_secret_env = "CDN_LAB_PREWARM_SECRET"

# One upstream open per window (ADR-0016): small here so the LAB can count opens
# against a 1 MiB object.
session_window_bytes = 262144
[cache_profiles.efficient]
# (promotion is retired, ADR-0015)
min_file_size = 4
coverage_window_secs = 5

# A small window keeps the run acceptance test cheap: one upstream open per
# window is the claim, and the LAB object is 1 MiB (ADR-0016).

[[upstreams]]
id = "media"
type = "openlist"
base_url = "http://127.0.0.1:5244/dav"
root_path = "media"
username_env = "CDN_LAB_DAV_USER"
password_env = "CDN_LAB_DAV_PASS"
cache_profile = "efficient"

[[routes]]
prefix = ""
upstream = "media"
