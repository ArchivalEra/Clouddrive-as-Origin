# CDN-LAB config I: content-read admission (ADR-0027, LAB section 16b).
#
# Content reads require a SigV4-presigned URL, and each `session` marker lives
# under a request/byte budget. The unit tests cover the signature chain, the
# expiry and the budget windows; what they cannot cover is the wiring -- that
# the front really consults the gate on a live connection before anything is
# proxied, that a bare curl (no signature) is refused at the door, and that the
# budget trips and recovers on a running instance.
#
# The exemption list is deliberately EMPTY: on a test box every request comes
# from loopback, so with the default list the refusal would be unreachable and
# every assertion would pass for the wrong reason. Production runs the same
# gate with the DEFAULT list, so loopback probes (accept.sh, the watchdog)
# stay unsigned while internet callers must present a URL a tenant signed.
#
# The knobs are tightened for reachability, not realism: the expiry cap is
# 300 s (a presigned URL for 301 s must be refused) and the session ceiling is
# 3 req/s (ten rapid reads must trip it). Production defaults are 6 h and
# 30 req/s -- generous for a viewer, far below a scraper.
front_listen = "127.0.0.1:7785"
front_metrics_listen = "127.0.0.1:9098"
front_content_auth = true
front_content_auth_exempt = []
front_content_auth_max_expiry_secs = 300
front_content_auth_session_rps = 3
front_content_auth_session_mib_per_min = 512
# Two tenants in one 0600 file, generated by run-lab.sh: the first
# unrestricted (the same pair the SigV4 section uses), one confined to
# media/ so the prefix assertion has both arms.
sigv4_credentials_path = "/mnt/hdd/CDN-LAB/content-auth.json"
listen_addr = "127.0.0.1:8089"
cache_dir = "/mnt/hdd/CDN-LAB/cache-i"
max_size_bytes = 268435456
inactive_ttl_secs = 1200
revalidate_ttl_secs = 60
negative_ttl_secs = 60
concurrency_per_upstream = 3
prewarm_shared_secret_env = "CDN_LAB_PREWARM_SECRET"
session_window_bytes = 262144
[cache_profiles.efficient]
min_file_size = 4

[[upstreams]]
id = "media"
type = "openlist"
base_url = "http://127.0.0.1:5244/dav"
root_path = "media"
username_env = "CDN_LAB_DAV_USER"
password_env = "CDN_LAB_DAV_PASS"
cache_profile = "efficient"

[[routes]]
prefix = ""
upstream = "media"
