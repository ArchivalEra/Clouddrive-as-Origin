# CDN-LAB config A: standard profile against a local rclone webdav
# (simulated OpenList). Plain http loopback upstream is allowed.
front_listen = "127.0.0.1:7777"
listen_addr = "127.0.0.1:8080"
cache_dir = "/mnt/hdd/CDN-LAB/cache-a"
max_size_bytes = 10737418240
inactive_ttl_secs = 1200
revalidate_ttl_secs = 60
negative_ttl_secs = 60
concurrency_per_upstream = 3
prewarm_shared_secret_env = "CDN_LAB_PREWARM_SECRET"

[[upstreams]]
id = "media"
type = "openlist"
base_url = "http://127.0.0.1:5244/dav"
root_path = "media"
username_env = "CDN_LAB_DAV_USER"
password_env = "CDN_LAB_DAV_PASS"

[[upstreams]]
id = "archive"
type = "openlist"
base_url = "http://127.0.0.1:5244/dav"
root_path = "archive"
username_env = "CDN_LAB_DAV_USER"
password_env = "CDN_LAB_DAV_PASS"

[[routes]]
prefix = ""
upstream = "media"
