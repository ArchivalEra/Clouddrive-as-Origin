[package]
name = "clouddrive-as-origin"
version = "0.1.0"
edition = "2021"
description = "Multi-backend pull-through origin shield (Google Drive, OneDrive, ...) — Pingora front + axum business plane, single binary"
license = "MIT"
repository = "https://github.com/ArchivalEra/Clouddrive-as-Origin"

[lib]
name = "origin_cache"
path = "src/lib.rs"

[[bin]]
name = "origin-cache"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "io-util", "fs"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
walkdir = "2"
async-trait = "0.1"
bytes = "1"
async-stream = "0.3"
futures = "0.3"
http-range-header = "0.4"
mime_guess = "2"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
tokio-util = { version = "0.7", features = ["io"] }
reqwest_dav = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
