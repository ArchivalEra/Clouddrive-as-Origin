name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A failing test should say where. The token this repo is pushed with cannot
  # download run logs, so every step below writes its output to a file and the
  # diagnostics step copies any failing one into the job summary, which the
  # check-run API does expose.
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the toolchain the tree is verified against (1.98.0, the
      # version every local rehearsal runs). Bump it deliberately, with a
      # local rehearsal, never by chasing `stable`.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - name: "build (origin + front)"
        run: cargo build --locked --workspace > ci-build.log 2>&1 || { cat ci-build.log; exit 1; }

      # One step per test target: a failing step names the failing target, and
      # the diagnostics step (below) carries its output into the job summary.
      - name: "test (workspace lib)"
        run: cargo test --locked --workspace --lib > ci-test-lib.log 2>&1

      - name: "test (integration)"
        run: cargo test --locked --test integration > ci-test-integration.log 2>&1

      - name: "test (openlist)"
        run: cargo test --locked --test openlist > ci-test-openlist.log 2>&1

      - name: "test (watchdog script)"
        run: cargo test --locked --test watchdog_script > ci-test-watchdog.log 2>&1

      - name: "test (front)"
        run: cargo test --locked -p origin-front --lib > ci-test-front.log 2>&1

      # The pre-push hook's clippy budget is 0; CI denies instead of counting.
      - name: "clippy (budget 0, enforced)"
        run: cargo clippy --workspace --all-targets --locked -- -D warnings > ci-clippy.log 2>&1

      # The pre-push hook's other half, so a push cannot be the first place a
      # CJK character is caught.
      - name: no CJK in tracked files
        run: |
          pattern='[\x{3000}-\x{303F}\x{3400}-\x{4DBF}\x{4E00}-\x{9FFF}\x{F900}-\x{FAFF}\x{FF01}-\x{FF5E}]'
          offenders=$(git grep -I -P -l -e "$pattern" HEAD -- . || true)
          if [ -n "$offenders" ]; then
            echo "CJK found in: $offenders"
            exit 1
          fi

      # Any failing step's log lands in the job summary: the check-run API
      # exposes that without admin rights, so a failure is diagnosable from
      # outside the Actions UI.
      - name: "diagnostics: failing logs into the job summary"
        if: failure()
        run: |
          {
            echo "## CI failure diagnostics"
            echo '```'
            ls -la ci-*.log 2>&1 || true
            for f in ci-*.log; do
              [ -f "$f" ] || continue
              echo "### $f (unconditional tail)"
              tail -100 "$f"
            done
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" 2>&1 || true
          # Belt and braces: also emit the tails as plain output, in case the
          # summary write itself is what is broken.
          for f in ci-*.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            tail -60 "$f"
          done
          exit 0
