name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A failing test should say where, since CI logs are not readable by the
  # token this repo is pushed with.
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the toolchain the tree is verified against (1.98.0, the
      # version every local rehearsal runs). Bump it deliberately, with a
      # local rehearsal, never by chasing `stable`.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - name: "build (origin + front)"
        run: cargo build --locked --workspace

      # One step per test target: a failing step names the failing target,
      # which is the part that matters when the logs are out of reach.
      - name: "test (workspace lib)"
        run: cargo test --locked --workspace --lib

      - name: "test (integration)"
        run: cargo test --locked --test integration

      - name: "test (openlist)"
        run: cargo test --locked --test openlist

      - name: "test (watchdog script)"
        run: cargo test --locked --test watchdog_script

      - name: "test (front)"
        run: cargo test --locked -p origin-front --lib

      # The pre-push hook's clippy budget is 0; CI denies instead of counting.
      - name: "clippy (budget 0, enforced)"
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The pre-push hook's other half, so a push cannot be the first place a
      # CJK character is caught.
      - name: no CJK in tracked files
        run: |
          pattern='[\x{3000}-\x{303F}\x{3400}-\x{4DBF}\x{4E00}-\x{9FFF}\x{F900}-\x{FAFF}\x{FF01}-\x{FF5E}]'
          offenders=$(git grep -I -P -l -e "$pattern" HEAD -- . || true)
          if [ -n "$offenders" ]; then
            echo "CJK found in: $offenders"
            exit 1
          fi
