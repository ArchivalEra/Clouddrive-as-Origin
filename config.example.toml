# Example config for Clouddrive-as-Origin.
# Copy to config.toml, fill env var names, never commit real secrets.
# Every secret/hostname is an env var reference — no usable literals.
# See docs/spec.md §§5,7 for semantics and defaults.

# --- planes ---
# Pingora front plane (TLS termination, H2, reverse-proxy to business plane)
# Dual-stack tip: "0.0.0.0:8443" is IPv4-only; "[::]:8443" binds both stacks
# (Linux default net.ipv6.bindv6only=0) — required when CDN origin-pull
# arrives over IPv6 (EdgeOne → IPv6-only hosts).
front_listen = "0.0.0.0:8443"
tls_cert_env = "ORIGIN_TLS_CERT_PATH"
tls_key_env = "ORIGIN_TLS_KEY_PATH"
# Prometheus metrics listener (loopback only). Distinct port per instance.
front_metrics_listen = "127.0.0.1:9090"
# Client CIDRs refused at connection time (before TLS handshake).
# Bare IP = single host. Example: front_ip_block = ["203.0.113.0/24"]
front_ip_block = []
# Client CIDRs exempt from per-IP rate limiting (ops path is never throttled).
front_ip_allow = []
# Per-client-IP requests/sec ceiling on the front. Omit = disabled;
# threshold lands after the real-traffic baseline (wayfinder #45).
# front_rate_rps = 500
# Proxy service worker threads (ADR-0004 era P6). Omit = 2; pingora's own
# default of 1 serializes TLS/H2 on a single core.
# front_threads = 2

# Business plane (axum on loopback — never exposed directly)
listen_addr = "127.0.0.1:8080"

# --- cache ---
cache_dir = "/var/lib/origin-cache"
max_size_bytes = 107374182400      # 100 GiB (spec §3.4)
max_entries = 500000              # entry-count budget (ADR-0006); 0 = bytes only
inactive_ttl_secs = 1200          # 20 min (spec §3.3)
revalidate_ttl_secs = 60          # spec §3.5
negative_ttl_secs = 60            # spec §3.6
# How staged .seg spans are evicted when they overshoot the budget (ADR-0015).
# Both policies evict SPANS from the least-recently-touched key first, so an
# overshoot trims the cold tail instead of discarding a whole key's window:
#   "lru"  - the stalest span goes first (a plain sliding window; the default)
#   "heat" - spans are compared by READ COUNT inside the trailing 20 spans
# Staged reads are served from these spans, so the ledger is the cache for
# objects larger than max_size_bytes.
eviction_policy = "lru"

# Bytes one staged-read run fetches (ADR-0016). One upstream open per window,
# shared by every reader inside it: a viewer's shard walk rides the watermark
# instead of opening per request (~640 ms each). Measured 63 MB/s from the
# provider, so 64 MiB is about a second of transfer; larger means fewer opens
# and more disk churn per window.
session_window_bytes = 67108864    # 64 MiB

# Seconds a key stays protected from eviction after the last body reading it
# ended (ADR-0017). While a body is streaming the key is protected regardless
# of its age; this grace covers the pause between two requests of one viewing
# session, so thinking about it does not cost a re-fetch. Disk pressure is the
# exception: it may still reclaim a resident stray being streamed, because the
# disk is the last resort and an open descriptor survives the unlink.
read_grace_secs = 300

# How long a key stays WATCHED after its last body ended (ADR-0018). A viewing
# session lasts hours while its bodies last milliseconds — EdgeOne asks for
# ascending 1 MiB shards, so the origin sees one request per shard — and a
# protection anchored to the last request alone therefore lapses mid-watch:
# pause for longer than read_grace_secs and the window the chain had already
# fetched becomes ordinary eviction material. A watch remembers where the
# viewer is for this long, and holds the read-ahead across the pause. 0 turns
# watching off, leaving a key protected only while a body streams it.
watch_idle_secs = 900              # 15 min

# Bytes pinned around a watching viewer's position (ADR-0018): half behind
# (what a small scrub back needs) and half ahead (the window the chain fetches
# before the player asks). A pin is a PREFERENCE, not an exemption — when
# nothing else can cover a trim the pin is spent too, from its back, because
# forward progress is continuous while a scrub back is deliberate. This is what
# keeps the byte budget real for a 200 GB object on a 10 GiB magazine.
# 0 disables pinning, which restores ADR-0017's coarser rule: a key being read
# keeps all of its spans, and the policy governs everything else.
watch_pin_bytes = 134217728        # 128 MiB, two default windows

# --- per-upstream throttling ---
concurrency_per_upstream = 3
retry_max_attempts = 4
retry_base_ms = 200
retry_max_ms = 30000

# --- observability & internal ---
prewarm_shared_secret_env = "ORIGIN_PREWARM_SECRET"
# Host allow-check applies to any redirect targets we follow (OpenList is
# loopback; direct 302 mode is not used, so this rarely fires).
allowed_download_suffixes = []

# --- S3-compatible inbound (spec §6.1) ---
# SigV4 verification of inbound requests (header auth + presigned URLs).
# OPTIONAL verify-if-present: unsigned requests pass through; set BOTH
# env vars to enable, leave both unset to disable the layer entirely.
# SIGV4_ACCESS_KEY_ID = "SIGV4_ACCESS_KEY_ID"
# SIGV4_SECRET_ACCESS_KEY = "SIGV4_SECRET_ACCESS_KEY"
# EdgeOne note (spec §6.1): the cache key must NOT include the
# Authorization header (default), and presigned traffic requires the
# cache key configured to ignore the entire query string. Never enable
# origin-pull URL rewriting or query stripping on signed routes.

# --- upstreams ---
# One upstream = one OpenList instance (or one WebDAV mount on it).
# OpenList fronts hundreds of cloud drives behind one folder tree; we cache
# over its WebDAV interface (native-proxy policy, Range-capable).
# OpenList credentials are web-UI credentials, injected via env — never
# written here.

[[upstreams]]
id = "media"
type = "openlist"
base_url = "http://127.0.0.1:5244/dav"   # loopback — OpenList runs beside us.
# Remote OpenList instances MUST use https (plain http is rejected for
# non-loopback hosts — WebDAV credentials ride on this connection).
root_path = "media"                       # optional subfolder in the mount
username_env = "OPENLIST_USERNAME"
password_env = "OPENLIST_PASSWORD"
# accept_invalid_certs = false            # self-signed TLS escape hatch
                                          # (dev/self-hosted only, default false)
# A relief valve (P1): cold-miss strategy per upstream.
#   "proxy" (default) — water-pipe bytes through us, always works.
#   "redirect" — 307 the viewer to an OpenList-issued direct link
#     (single handshake, cloud bandwidth), background fill, silent
#     proxy fallback. Requires link_api_token_env; hits never redirect.
# cold_miss = "proxy"
# link_api_token_env = "OPENLIST_LINK_TOKEN"  # OpenList static admin token
                                              # (Settings → Other → Token)

# Fill-policy profiles (P2 efficientcache): orthogonal to cold_miss
# (serve behavior). Upstreams opt in with `cache_profile = "<name>"`;
# "standard" (default) = legacy full-file water-pipe on every miss.
# An efficient profile stages served intervals as .seg sidecars and serves
# later ranged reads from them (ADR-0015), so the ledger acts as a sliding
# window for objects the magazine cannot hold whole.
# cache_profile = "efficient"
# [cache_profiles.efficient]
# min_file_size = 67108864   # below this, miss goes B (small files fill cheap)
# coverage_window_secs = 3600  # staged spans older than this decay out

# "nocache" is a built-in profile for small-footprint nodes: pure
# water-pipe, zero cache-object disk writes (no entries, no segments,
# no tombstones; prewarm is a no-op; HEAD is a pure stat). Only the
# redb metadata file exists on disk. Use it for nodes with tiny disks
# that just stream bytes:
# cache_profile = "nocache"

# Multi-OpenList: add more instances and route key prefixes to them.
# [[upstreams]]
# id = "archive"
# type = "openlist"
# base_url = "http://127.0.0.1:5245/dav"
# root_path = ""
# username_env = "OPENLIST2_USERNAME"
# password_env = "OPENLIST2_PASSWORD"

# --- routes ---
# First-match prefix → upstream. Sorted longest-prefix first at load time;
# "" is the default (catch-all). Adding an upstream is a config-only change.
[[routes]]
prefix = ""
upstream = "media"

# Example prefix route to a second upstream:
# [[routes]]
# prefix = "archive/"
# upstream = "archive"
